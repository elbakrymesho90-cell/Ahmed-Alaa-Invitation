<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ahmed & Alaa</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;

align-items:center;
background:#4b0008;
background-image:radial-gradient(circle,#65000d,#3b0006);
font-family:Georgia,serif;

}

.card{
width:90%;
max-width:420px;
padding:50px 30px;
border:1px solid rgba(233,199,139,.4);
text-align:center;
border-radius:20px;
background:rgba(0,0,0,.15);
backdrop-filter:blur(8px);
}

h3{
font-weight:normal;
letter-spacing:3px;
margin-bottom:20px;
}

h1{
font-size:60px;
font-style:italic;
line-height:1.2;
}

span{
display:block;
font-size:40px;
margin:15px 0;
}

p{
margin-top:25px;
font-size:18px;
}

button{
margin-top:40px;
padding:15px 35px;
border:none;
border-radius:40px;
background:#d4af37;
color:#4b0008;
font-size:18px;
cursor:pointer;
font-weight:bold;
}
</style>

</head>

<body>

<div class="card">

<h3>ENGAGEMENT</h3>

<h1>
Ahmed

</p>
